spring.application.name=sistemacomercial

# ============== DATASOURCE MYSQL ==============
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistemacomercial?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============== JPA / HIBERNATE ==============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============== THYMELEAF ==============
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============== SERVER ==============
server.port=8081
server.address=127.0.0.1

# ============== IMPORTACION DE ARCHIVOS ==============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.product-images=${PRODUCT_IMAGES_DIR:./data/product-images}

# ============== SEGURIDAD INICIAL ==============
# Cambiar este valor antes de usar el sistema fuera de desarrollo.
app.security.initial-admin-username=${ADMIN_INITIAL_USERNAME}
app.security.initial-admin-password=${ADMIN_INITIAL_PASSWORD}
