<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuración del negocio</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0;">Configuración del negocio</h2>
            <a th:href="@{/ui/products}" class="button secondary">Volver</a>
        </div>
        <p>El logo se mostrará en el sistema y en los comprobantes de venta. Formatos permitidos: JPG o PNG, hasta 5 MB.</p>

        <div class="business-logo-preview" th:if="${logoAvailable}">
            <img th:src="@{/ui/settings/logo}" alt="Logo actual del negocio">
        </div>

        <form th:action="@{/ui/settings/logo}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="business-logo" th:text="${logoAvailable ? 'Reemplazar logo' : 'Subir logo'}">Subir logo</label>
            <input id="business-logo" type="file" name="logo" accept="image/jpeg,image/png" required>
            <div class="actions">
                <button type="submit" class="button">Guardar logo</button>
            </div>
        </form>

        <form th:if="${logoAvailable}" th:action="@{/ui/settings/logo/delete}" method="post" class="business-logo-remove">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="button danger"
                    onclick="return confirm('¿Eliminar el logo del negocio?');">Eliminar logo</button>
        </form>
    </div>
</main>
</body>
</html>
