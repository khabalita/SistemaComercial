<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Editar proveedor' : 'Nuevo proveedor'">Proveedor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <h2 th:text="${isEdit} ? 'Editar proveedor' : 'Nuevo proveedor'"></h2>

        <div th:if="${errorMessage}" class="form-error">
            <strong th:text="${errorMessage}"></strong>
            <ul th:if="${fieldErrors}" style="margin:6px 0 0 16px;padding:0;">
                <li th:each="e : ${fieldErrors}" th:text="${e}"></li>
            </ul>
        </div>

        <form th:action="@{${isEdit} ? '/ui/providers/' + ${itemId} + '/edit' : '/ui/providers/new'}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-grid">
                <div>
                    <label>Nombre *</label>
                    <input type="text" name="name" th:value="${provider.name}" required maxlength="100">
                </div>
                <div>
                    <label>CUIT</label>
                    <input type="text" name="taxId" th:value="${provider.taxId}" maxlength="20">
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" name="email" th:value="${provider.email}" maxlength="100">
                </div>
                <div>
                    <label>Teléfono</label>
                    <input type="text" name="phone" th:value="${provider.phone}" maxlength="20">
                </div>
                <div>
                    <label>Sitio web</label>
                    <input type="text" name="website" th:value="${provider.website}" maxlength="150">
                </div>
                <div class="full">
                    <label>Dirección</label>
                    <input type="text" name="address" th:value="${provider.address}" maxlength="200">
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="button">Guardar</button>
                <a th:href="@{/ui/providers}" class="button secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
