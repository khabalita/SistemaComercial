<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar precios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0;">Actualizar precios</h2>
            <a th:href="@{/ui/products}" class="button secondary">Volver</a>
        </div>
        <div th:if="${errorMessage}" class="form-error" th:text="${errorMessage}"></div>
        <form th:action="@{/ui/products/prices/preview}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-grid">
                <div>
                    <label for="brandId">Alcance</label>
                    <select id="brandId" name="brandId">
                        <option value="">Todos los productos</option>
                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="|Marca: ${b.name}|"
                                th:selected="${brandId != null and brandId == b.id}"></option>
                    </select>
                </div>
                <div>
                    <label for="adjustmentType">Tipo de ajuste</label>
                    <select id="adjustmentType" name="adjustmentType">
                        <option value="PERCENTAGE" th:selected="${adjustmentType == null or adjustmentType == 'PERCENTAGE'}">Porcentaje</option>
                        <option value="FIXED" th:selected="${adjustmentType == 'FIXED'}">Importe fijo</option>
                    </select>
                </div>
                <div>
                    <label for="value">Valor</label>
                    <input id="value" type="number" name="value" step="0.01" th:value="${value}" required>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="button">Previsualizar cambios</button>
            </div>
        </form>
    </div>

    <div class="card" th:if="${preview != null}">
        <div class="toolbar">
            <h3 style="margin:0;" th:text="|Productos afectados: ${#lists.size(preview)}|">Vista previa</h3>
            <form th:action="@{/ui/products/prices/apply}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="brandId" th:value="${brandId}">
                <input type="hidden" name="adjustmentType" th:value="${adjustmentType}">
                <input type="hidden" name="value" th:value="${value}">
                <button type="submit" class="button" th:disabled="${#lists.isEmpty(preview)}">Confirmar actualización</button>
            </form>
        </div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>Código</th><th>Producto</th><th>Precio anterior</th><th>Precio nuevo</th></tr></thead>
                <tbody>
                <tr th:each="change : ${preview}">
                    <td th:text="${change.internalCode}"></td>
                    <td th:text="${change.productName}"></td>
                    <td th:text="${change.previousPrice}"></td>
                    <td><strong th:text="${change.newPrice}"></strong></td>
                </tr>
                <tr th:if="${#lists.isEmpty(preview)}"><td colspan="4" class="empty-state">No hay productos afectados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
