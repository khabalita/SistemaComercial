<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Editar producto' : 'Nuevo producto'">Producto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <h2 th:text="${isEdit} ? 'Editar producto' : 'Nuevo producto'"></h2>

        <div th:if="${errorMessage}" class="form-error">
            <strong th:text="${errorMessage}"></strong>
            <ul style="margin:6px 0 0 16px;padding:0;">
                <li th:each="e : ${fieldErrors}" th:text="${e}"></li>
            </ul>
        </div>

        <form id="product-form" th:action="@{${isEdit} ? '/ui/products/' + ${productId} + '/edit' : '/ui/products/new'}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-grid">
                <div>
                    <label>Nombre *</label>
                    <input type="text" name="name" th:value="${product.name}" required maxlength="200">
                </div>
                <div>
                    <label>Codigo interno *</label>
                    <input type="text" name="internalCode" th:value="${product.internalCode}" required maxlength="50">
                </div>
                <div>
                    <label>Codigo de barras</label>
                    <input type="text" name="barCode" th:value="${product.barCode}" maxlength="50">
                </div>
                <div>
                    <label>Codigo de proveedor</label>
                    <input type="text" name="providerCode" th:value="${product.providerCode}" maxlength="50">
                </div>
                <div>
                    <label>Moneda *</label>
                    <select name="coinId" required>
                        <option th:each="c : ${coins}"
                                th:value="${c.id}"
                                th:text="${c.code + ' - ' + c.name}"
                                th:selected="${product.coinId != null and product.coinId == c.id}"></option>
                    </select>
                </div>
                <div>
                    <label>Tipo de IVA *</label>
                    <select name="ivaTypeId" required>
                        <option th:each="i : ${ivaTypes}"
                                th:value="${i.id}"
                                th:text="${i.description}"
                                th:attr="data-percentage=${i.percentage}"
                                th:selected="${product.ivaTypeId != null and product.ivaTypeId == i.id}"></option>
                    </select>
                </div>
                <div>
                    <label>Categoria</label>
                    <div class="product-picker lookup-picker">
                        <input type="search" class="product-search" data-options-id="category-options"
                               placeholder="Buscar categoria..." aria-label="Buscar categoria"
                               role="combobox" aria-expanded="false" aria-controls="category-results" autocomplete="off">
                        <input type="hidden" name="categoryId" th:value="${product.categoryId}">
                        <select id="category-options" hidden aria-hidden="true" tabindex="-1">
                        <option value="">-- Sin categoria --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                        </select>
                        <div id="category-results" class="product-results" role="listbox"></div>
                    </div>
                </div>
                <div>
                    <label>Marca</label>
                    <div class="product-picker lookup-picker">
                        <input type="search" class="product-search" data-options-id="brand-options"
                               placeholder="Buscar marca..." aria-label="Buscar marca"
                               role="combobox" aria-expanded="false" aria-controls="brand-results" autocomplete="off">
                        <input type="hidden" name="brandId" th:value="${product.brandId}">
                        <select id="brand-options" hidden aria-hidden="true" tabindex="-1">
                        <option value="">-- Sin marca --</option>
                        <option th:each="b : ${brands}"
                                th:value="${b.id}"
                                th:text="${b.name}"></option>
                        </select>
                        <div id="brand-results" class="product-results" role="listbox"></div>
                    </div>
                </div>
                <div>
                    <label>Proveedor *</label>
                    <div class="product-picker lookup-picker">
                        <input type="search" class="product-search" data-options-id="provider-options"
                               placeholder="Buscar proveedor..." aria-label="Buscar proveedor" required
                               role="combobox" aria-expanded="false" aria-controls="provider-results" autocomplete="off">
                        <input type="hidden" name="providerId" th:value="${product.providerId}">
                        <select id="provider-options" hidden aria-hidden="true" tabindex="-1">
                        <option th:each="p : ${providers}"
                                th:value="${p.id}"
                                th:text="${p.name}"></option>
                        </select>
                        <div id="provider-results" class="product-results" role="listbox"></div>
                    </div>
                </div>
                <div>
                    <label>Costo *</label>
                    <input type="number" name="cost" step="0.01" min="0.01" th:value="${product.cost}" required>
                </div>
                <div>
                    <label>Margen (%) *</label>
                    <input type="number" name="margin" step="0.01" min="0" th:value="${product.margin}" required>
                </div>
                <div>
                    <label>Precio de venta</label>
                    <input type="number" name="salePrice" step="0.01" min="0.01" th:value="${product.salePrice}">
                    <small>Se calcula automáticamente con costo, margen e IVA. Puedes dejarlo vacío y se calculará al guardar; también puedes editarlo manualmente.</small>
                </div>
                <div>
                    <label>Stock *</label>
                    <input type="number" name="stock" min="0" th:value="${product.stock != null ? product.stock : 0}" required>
                </div>
                <div>
                    <label>Stock minimo</label>
                    <input type="number" name="minStock" min="0" th:value="${product.minStock}">
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="button">Guardar</button>
                <a th:href="@{/ui/products}" class="button secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<script>
    (() => {
        const form = document.getElementById('product-form');
        if (!form) return;

        const costInput = form.elements.namedItem('cost');
        const marginInput = form.elements.namedItem('margin');
        const ivaSelect = form.elements.namedItem('ivaTypeId');
        const salePriceInput = form.elements.namedItem('salePrice');

        const updateSalePrice = () => {
            const cost = Number(costInput.value);
            const margin = Number(marginInput.value);
            const ivaOption = ivaSelect.selectedOptions[0];
            const iva = Number(ivaOption?.dataset.percentage);
            if (!costInput.value || !marginInput.value || !ivaOption ||
                !Number.isFinite(cost) || cost <= 0 || !Number.isFinite(margin) || !Number.isFinite(iva)) return;

            const price = cost * (1 + margin / 100) * (1 + iva / 100);
            salePriceInput.value = (Math.round((price + Number.EPSILON) * 100) / 100).toFixed(2);
        };

        [costInput, marginInput].forEach(input => {
            input.addEventListener('input', updateSalePrice);
            input.addEventListener('change', updateSalePrice);
        });
        ivaSelect.addEventListener('input', updateSalePrice);
        ivaSelect.addEventListener('change', updateSalePrice);
        if (!salePriceInput.value) updateSalePrice();

        const normalizeLookup = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase().trim();
        const lookupPickers = Array.from(form.querySelectorAll('.lookup-picker'));

        const closeLookup = picker => {
            picker.querySelector('.product-results').classList.remove('open');
            picker.querySelector('.product-search').setAttribute('aria-expanded', 'false');
        };

        lookupPickers.forEach(picker => {
            const search = picker.querySelector('.product-search');
            const hidden = picker.querySelector('input[type="hidden"]');
            const source = document.getElementById(search.dataset.optionsId);
            const results = picker.querySelector('.product-results');
            let activeIndex = -1;

            const choose = option => {
                hidden.value = option.value;
                search.value = option.value ? option.textContent.trim() : '';
                search.setCustomValidity('');
                closeLookup(picker);
            };

            const renderResults = query => {
                results.replaceChildren();
                activeIndex = -1;
                const normalizedQuery = normalizeLookup(query);
                const options = Array.from(source.options).filter(option =>
                    normalizeLookup(option.textContent).includes(normalizedQuery)
                ).slice(0, 15);

                if (options.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'product-result-empty';
                    empty.textContent = 'No se encontraron opciones';
                    results.appendChild(empty);
                } else {
                    options.forEach(option => {
                        const result = document.createElement('button');
                        result.type = 'button';
                        result.className = 'product-result';
                        result.setAttribute('role', 'option');
                        result.setAttribute('aria-selected', String(option.value === hidden.value));
                        result.textContent = option.textContent.trim();
                        result.addEventListener('mousedown', event => event.preventDefault());
                        result.addEventListener('click', () => choose(option));
                        results.appendChild(result);
                    });
                }

                results.classList.add('open');
                search.setAttribute('aria-expanded', 'true');
            };

            const selected = Array.from(source.options).find(option => option.value === hidden.value);
            if (selected && selected.value) search.value = selected.textContent.trim();

            search.addEventListener('focus', () => renderResults(search.value));
            search.addEventListener('input', () => {
                hidden.value = '';
                search.setCustomValidity('');
                renderResults(search.value);
            });
            picker.addEventListener('focusout', () => {
                window.setTimeout(() => {
                    if (!picker.contains(document.activeElement)) closeLookup(picker);
                }, 0);
            });
            search.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown' && !results.classList.contains('open')) {
                    renderResults(search.value);
                }
                const options = Array.from(results.querySelectorAll('.product-result'));
                if (event.key === 'Escape') {
                    closeLookup(picker);
                } else if (event.key === 'ArrowDown' && options.length) {
                    event.preventDefault();
                    activeIndex = Math.min(activeIndex + 1, options.length - 1);
                    options.forEach((option, index) => option.classList.toggle('active', index === activeIndex));
                    options[activeIndex].scrollIntoView({ block: 'nearest' });
                } else if (event.key === 'ArrowUp' && options.length) {
                    event.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, 0);
                    options.forEach((option, index) => option.classList.toggle('active', index === activeIndex));
                    options[activeIndex].scrollIntoView({ block: 'nearest' });
                } else if (event.key === 'Enter' && results.classList.contains('open') && options.length) {
                    event.preventDefault();
                    options[activeIndex >= 0 ? activeIndex : 0].click();
                }
            });
        });

        document.addEventListener('click', event => {
            lookupPickers.forEach(picker => {
                if (!picker.contains(event.target)) closeLookup(picker);
            });
        });

        form.addEventListener('submit', event => {
            for (const picker of lookupPickers) {
                const search = picker.querySelector('.product-search');
                const hidden = picker.querySelector('input[type="hidden"]');
                const hasQueryWithoutSelection = search.value.trim() && !hidden.value;
                const missingRequiredSelection = search.required && !hidden.value;
                if (hasQueryWithoutSelection || missingRequiredSelection) {
                    search.setCustomValidity('Selecciona una opción de la lista.');
                    event.preventDefault();
                    search.reportValidity();
                    return;
                }
            }
        });
    })();
</script>
</body>
</html>
