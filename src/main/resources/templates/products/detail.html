<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Producto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card product-image-card" id="product-image">
        <h3>Imagen del producto</h3>
        <img class="product-image" th:src="@{|/ui/products/${product.id}/image|}" th:alt="${product.name}">
        <div class="image-actions" th:if="${isAdmin}">
            <form th:action="@{|/ui/products/${product.id}/image|}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="file" name="image" accept="image/jpeg,image/png" required>
                <button type="submit" class="button">Cargar imagen</button>
            </form>
            <form th:if="${product.hasImage}" th:action="@{|/ui/products/${product.id}/image/delete|}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button danger">Eliminar imagen</button>
            </form>
        </div>
    </div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0;" th:text="${product.name}"></h2>
            <div>
                <a th:href="@{|/ui/products/${product.id}/edit|}" class="icon-button edit" title="Editar producto" aria-label="Editar producto">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L18.8 8.7l-3.5-3.5L4 16.5Zm16.7-10.3a.9.9 0 0 0 0-1.3l-1.6-1.6a.9.9 0 0 0-1.3 0l-1.4 1.4 3.5 3.5 1.4-1.4Z"/></svg>
                    <span class="sr-only">Editar</span>
                </a>
                <a th:href="@{/ui/products}" class="button secondary">Volver</a>
            </div>
        </div>

        <section class="detail-section">
            <h3 class="detail-section-title">Identificacion</h3>
            <div class="detail-fields">
                <div class="detail-field"><label>Codigo interno</label><div class="detail-field-value" th:text="${product.internalCode}"></div></div>
                <div class="detail-field"><label>Codigo de barras</label><div class="detail-field-value" th:classappend="${product.barCode == null or product.barCode.isBlank()} ? 'empty'" th:text="${product.barCode} ?: '-'">-</div></div>
                <div class="detail-field"><label>Codigo de proveedor</label><div class="detail-field-value" th:classappend="${product.providerCode == null or product.providerCode.isBlank()} ? 'empty'" th:text="${product.providerCode} ?: '-'">-</div></div>
            </div>
        </section>

        <section class="detail-section">
            <h3 class="detail-section-title">Clasificacion</h3>
            <div class="detail-fields">
                <div class="detail-field"><label>Proveedor</label><div class="detail-field-value" th:classappend="${product.providerName == null or product.providerName.isBlank()} ? 'empty'" th:text="${product.providerName} ?: '-'">-</div></div>
                <div class="detail-field"><label>Categoria</label><div class="detail-field-value" th:classappend="${product.categoryName == null or product.categoryName.isBlank()} ? 'empty'" th:text="${product.categoryName} ?: '-'">-</div></div>
                <div class="detail-field"><label>Marca</label><div class="detail-field-value" th:classappend="${product.brandName == null or product.brandName.isBlank()} ? 'empty'" th:text="${product.brandName} ?: '-'">-</div></div>
            </div>
        </section>

        <section class="detail-section">
            <h3 class="detail-section-title">Informacion comercial</h3>
            <div class="detail-fields">
                <div class="detail-field"><label>Tipo de IVA</label><div class="detail-field-value" th:text="${product.ivaTypeDescription}"></div></div>
                <div class="detail-field"><label>Moneda</label><div class="detail-field-value" th:text="${product.coinCode}"></div></div>
                <div class="detail-field"><label>Costo</label><div class="detail-field-value" th:text="${product.coinCode + ' ' + product.cost}"></div></div>
                <div class="detail-field"><label>Margen</label><div class="detail-field-value" th:text="${product.margin + ' %'}"></div></div>
                <div class="detail-field"><label>Precio de venta</label><div class="detail-field-value" th:text="${product.coinCode + ' ' + product.salePrice}"></div></div>
            </div>
        </section>

        <section class="detail-section">
            <h3 class="detail-section-title">Inventario</h3>
            <div class="detail-fields">
                <div class="detail-field"><label>Stock actual</label><div class="detail-field-value" th:text="${product.stock}"></div></div>
                <div class="detail-field"><label>Stock minimo</label><div class="detail-field-value" th:classappend="${product.minStock == null} ? 'empty'" th:text="${product.minStock != null ? product.minStock : '-'}">-</div></div>
            </div>
        </section>
    </div>

    <div class="card">
        <h3>Ajuste de stock</h3>
        <form th:action="@{|/ui/products/${product.id}/stock|}" method="post" class="stock-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="stock-current">
                <label>Stock actual</label>
                <div class="detail-field-value" th:text="${product.stock}"></div>
            </div>
            <div>
                <label for="new-stock">Nuevo stock</label>
                <input id="new-stock" type="number" name="stock" min="0" th:value="${product.stock}" required>
            </div>
            <button type="submit" class="button">Actualizar stock</button>
        </form>
    </div>
</main>
</body>
</html>
