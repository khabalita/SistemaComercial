<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0;">Clientes</h2>
            <a th:href="@{/ui/customers/new}" class="button">+ Nuevo cliente</a>
        </div>

        <form class="filters" method="get" th:action="@{/ui/customers}">
            <input type="text" name="name" placeholder="Buscar por nombre" th:value="${param.name}">
            <button type="submit" class="button secondary">Filtrar</button>
            <a th:href="@{/ui/customers}" class="button secondary">Limpiar</a>
        </form>

        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>CUIT/DNI</th>
                <th>Localidad</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="7" class="empty-state">Sin clientes cargados.</td>
            </tr>
            <tr th:each="c : ${customers}">
                <td th:text="${c.name}"></td>
                <td th:text="${c.taxId} ?: '-'"></td>
                <td th:text="${c.city} ?: '-'"></td>
                <td th:text="${c.email} ?: '-'"></td>
                <td th:text="${c.phone} ?: '-'"></td>
                <td>
                    <span th:text="${c.active ? 'Activo' : 'Inactivo'}"
                          th:classappend="${c.active ? 'tag' : 'tag low'}"></span>
                </td>
                <td>
                    <a th:href="@{|/ui/customers/${c.id}/edit|}" class="icon-button edit" title="Editar cliente" aria-label="Editar cliente">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L18.8 8.7l-3.5-3.5L4 16.5Zm16.7-10.3a.9.9 0 0 0 0-1.3l-1.6-1.6a.9.9 0 0 0-1.3 0l-1.4 1.4 3.5 3.5 1.4-1.4Z"/></svg>
                        <span class="sr-only">Editar</span>
                    </a>
                    <a th:href="@{|/ui/customers/${c.id}/account|}" class="icon-button view" title="Cuenta corriente" aria-label="Cuenta corriente">
                        <span aria-hidden="true">$</span>
                        <span class="sr-only">Cuenta corriente</span>
                    </a>
                     <form th:action="@{|/ui/customers/${c.id}/delete|}" method="post" style="display:inline;"
                           onsubmit="return confirm('¿Eliminar el cliente ' + '[[${c.name}]]' + '?');">
                         <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="icon-button delete" title="Eliminar cliente" aria-label="Eliminar cliente">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-.7 13H6.7L6 7Zm3-3h6l1 2H8l1-2Zm-5 2h16v2H4V6Z"/></svg>
                            <span class="sr-only">Eliminar</span>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${page.hasPrevious()}"
               th:href="@{/ui/customers(page=${page.number - 1},name=${name})}"
               class="button small secondary">Anterior</a>
            <span th:text="|Página ${page.number + 1} de ${page.totalPages}|"></span>
            <a th:if="${page.hasNext()}"
               th:href="@{/ui/customers(page=${page.number + 1},name=${name})}"
               class="button small secondary">Siguiente</a>
        </div>
        <div class="pagination-info" th:text="${page.totalElements} + ' clientes'"></div>
    </div>
</main>
</body>
</html>
