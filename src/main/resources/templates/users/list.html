<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <h2>Usuarios</h2>
        <div th:if="${errorMessage}" class="form-error" th:text="${errorMessage}"></div>
        <form method="post" th:action="@{/ui/users}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Usuario</label>
            <input type="text" name="username" maxlength="80" required>
            <label>Contraseña</label>
            <input type="password" name="password" minlength="8" required>
            <label>Rol</label>
            <select name="role" required>
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
            </select>
            <button type="submit" class="button">Crear usuario</button>
        </form>
    </div>
    <div class="card">
        <h3>Usuarios existentes</h3>
        <table>
            <thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th></tr></thead>
            <tbody><tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.role}"></td>
                <td th:text="${user.enabled ? 'Activo' : 'Inactivo'}"></td>
            </tr></tbody>
        </table>
    </div>
</main>
</body>
</html>
